version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major versions we can't take yet (see docs/DEVELOPER.md):
    ignore:
      - dependency-name: "typescript"  # TypeScript 7: @react-router/dev peers typescript ^5 || ^6, @typescript-eslint < 6.1
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"  # types must match the oldest supported Node version, not the newest
        update-types: ["version-update:semver-major"]
      # React Router moves as one family; @shopify/shopify-app-react-router 4.x
      # peers react-router ^7, and RR 8 needs Node >=22.22 (we promise >=22.18)
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/*"
        update-types: ["version-update:semver-major"]
      # @shopify/shopify-app-session-storage-prisma 11.x peers prisma ^6
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # @typescript-eslint/parser and /eslint-plugin must share one version: update both by hand
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      # ESLint 10: eslint-plugin-react, eslint-plugin-import and eslint-plugin-jsx-a11y peer eslint <= 9
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"  # moves with eslint
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
